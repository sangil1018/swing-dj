<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SwingDJ — 스윙 재즈 DJ 플레이어</title>
  <meta name="description" content="스윙 재즈 댄스를 위한 심플 DJ 플레이어. 플레이리스트, 큐 관리, 분리 출력, 5밴드 EQ 지원." />
  <meta name="theme-color" content="#0d0e12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- 스타일 -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/player.css" />
  <link rel="stylesheet" href="styles/playlist.css" />
  <link rel="stylesheet" href="styles/equalizer.css" />
  <link rel="stylesheet" href="styles/profile.css" />

  <!-- jsmediatags (ID3 태그 + 앨범아트) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="show-playlist">

<div id="app" class="show-playlist">

  <!-- ══ 헤더 ═══════════════════════════════════════════ -->
  <header id="app-header">
    <div class="app-logo">
      <span class="logo-icon">🎷</span>
      <span>Swing<span class="logo-accent">DJ</span></span>
    </div>

    <!-- 출력 장치 선택 토글 (모바일용) -->
    <button class="header-mobile-toggle" id="btn-toggle-devices">장치 설정</button>

    <!-- 출력 장치 선택 -->
    <div class="header-devices" id="header-devices">
      <div class="device-group">
        <span class="device-label">🔊 메인 출력</span>
        <select id="sel-main-device" class="device-select" title="메인 스피커 출력 장치">
          <option value="default">시스템 기본</option>
        </select>
      </div>

      <div class="device-sep"></div>

      <div class="device-group">
        <span class="device-label cue">🎧 CUE 출력</span>
        <select id="sel-cue-device" class="device-select" title="헤드폰/모니터 출력 장치 (큐 미리듣기)">
          <option value="default">시스템 기본</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ══ 플레이리스트 패널 ═══════════════════════════════ -->
  <section id="playlist-panel" class="panel" aria-label="플레이리스트">
    <!-- PlaylistUI.mount()로 렌더됨 -->
  </section>

  <!-- ══ 메인 플레이어 패널 ══════════════════════════════ -->
  <main id="player-panel" aria-label="플레이어" data-active-deck="player">
    <!-- 상단 덱 전환 탭 바 (탭 클릭 + 카드 좌우 스와이프 병행 지원) -->
    <div id="deck-switcher" class="deck-switcher" role="tablist" aria-label="플레이어 덱 모드 전환">
      <button type="button" class="deck-tab active" id="deck-tab-player" data-deck-target="player" role="tab" aria-selected="true" title="메인 플레이 컨트롤 (탭 클릭 또는 좌우 스와이프)">
        <span class="deck-tab-label">▶️ 플레이 컨트롤</span>
        <span class="deck-tab-badge" id="deck-badge-player">대기</span>
      </button>
      <button type="button" class="deck-tab" id="deck-tab-comp" data-deck-target="comp" role="tab" aria-selected="false" title="대회용 컴핏모드 타이머 (단축키: C / 좌우 스와이프)">
        <span class="deck-tab-label">🏆 컴핏모드</span>
        <span class="deck-tab-badge" id="deck-badge-comp">01:40</span>
      </button>
      <button type="button" class="deck-tab" id="deck-tab-metro" data-deck-target="metro" role="tab" aria-selected="false" title="내장 메트로놈 (단축키: M / 좌우 스와이프)">
        <span class="deck-tab-label">⏱️ 메트로놈</span>
        <span class="deck-tab-badge" id="deck-badge-metro">140</span>
      </button>
      <button type="button" class="deck-expand-btn" id="deck-expand-btn" aria-pressed="false" title="3개 카드 한눈에 펼쳐보기 / 탭 전환 모드 토글">⊞</button>
    </div>

    <!-- 스와이프 전환 스테이지 (플레이 컨트롤 / 컴핏모드 / 메트로놈) -->
    <div id="deck-stage" class="deck-stage">
      <!-- 플레이어 컨트롤 영역 -->
      <div id="player-inner"></div>
      <!-- 스윙 DJ 도구 (컴핏모드 타이머 + 메트로놈) -->
      <div id="dj-tools-container"></div>
    </div>

    <!-- 5밴드 EQ -->
    <div id="eq-container"></div>
  </main>

  <!-- ══ 모바일용 탭 ═════════════════════════════════════ -->
  <div id="mobile-tabs" class="mobile-tabs">
    <button class="m-tab-btn active" data-target="playlist-panel">플레이리스트</button>
    <button class="m-tab-btn" data-target="queue-panel">큐</button>
  </div>

  <!-- ══ 큐 패널 ═════════════════════════════════════════ -->
  <section id="queue-panel" class="panel" aria-label="큐">
    <!-- QueueUI.mount()로 렌더됨 -->
  </section>

  <!-- ══ 상태 바 ═════════════════════════════════════════ -->
  <div id="status-bar" role="status" aria-live="polite">준비 중…</div>

</div>

<!-- ES Module 진입점 -->
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
